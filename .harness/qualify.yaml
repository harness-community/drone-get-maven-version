                  tolerations:
                    - effect: NoSchedule
                      key: node.kubernetes.io/os
                      operator: Equal
                      value: windows
              execution:
                steps:
                  - step:
                      type: Run
                      name: Image contract
                      identifier: image_contract
                      timeout: 60m
                      spec:
                        connectorRef: <+pipeline.variables.dockerConnector>
                        image: <+pipeline.variables.windows2022Image>
