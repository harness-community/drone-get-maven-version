                          variable_prefix: maven
                          mode: raw_gav
                  - step:
                      type: Run
                      name: Check step outputs
                      identifier: check_outputs
                      timeout: 60m
                      spec:
                        connectorRef: <+pipeline.variables.dockerConnector>
                        image: <+pipeline.variables.windows2022Image>
                        shell: Powershell
                        envVariables:
                          LEGACY_POM_VERSION: <+execution.steps.legacy_pom_path.output.outputVariables.POM_VERSION>
                          RAW_GROUP_ID: <+execution.steps.bamboo_raw_gav.output.outputVariables.MAVEN_GROUP_ID>
                          RAW_ARTIFACT_ID: <+execution.steps.bamboo_raw_gav.output.outputVariables.MAVEN_ARTIFACT_ID>
                          RAW_VERSION: <+execution.steps.bamboo_raw_gav.output.outputVariables.MAVEN_VERSION>
                          RAW_POM_VERSION: <+execution.steps.bamboo_raw_gav.output.outputVariables.POM_VERSION>
                        command: |-
                          $checks = @(
                            @('legacy POM_VERSION', $env:LEGACY_POM_VERSION, '1.4.2'),
                            @('MAVEN_GROUP_ID (from parent)', $env:RAW_GROUP_ID, 'com.elevance.platform'),
                            @('MAVEN_ARTIFACT_ID', $env:RAW_ARTIFACT_ID, 'claims-service'),
                            @('MAVEN_VERSION (from property)', $env:RAW_VERSION, '2.3.4'),
                            @('POM_VERSION in raw_gav', $env:RAW_POM_VERSION, '2.3.4')
                          )
                          $failed = 0
                          foreach ($c in $checks) {
                            if ($c[1] -ceq $c[2]) { Write-Host "PASS  $($c[0]) = $($c[1])" }
                            else { Write-Host "FAIL  $($c[0]): got '$($c[1])', want '$($c[2])'"; $failed++ }
                          }
                          if ($failed) { exit 1 }
        - stage:
            name: Qualify Windows LTSC 2025
            identifier: qualify_windows_ltsc2025
            type: CI
            spec:
              cloneCodebase: true
              infrastructure:
                type: KubernetesDirect
                spec:
                  connectorRef: <+pipeline.variables.windows2025Connector>
