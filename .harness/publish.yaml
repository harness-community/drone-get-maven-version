pipeline:
  name: Maven POM Parser - Publish Windows Images
  identifier: maven_pom_publish
  projectIdentifier: Drone_Plugins
  orgIdentifier: default
  description: Builds each Windows image on a host whose build matches its LTSC, pushes only the immutable windows-ltscXXXX-rN tag, then runs the image contract against the pushed image. Moving tags are not touched here; they move in the promote pipeline after qualification. To release a changed image, bump IMAGE_VERSION in its Dockerfile and the tag below to the next rN.
  properties:
    ci:
      codebase:
        connectorRef: GitHub_Harness_Community_Org
        repoName: drone-get-maven-version
        build: <+input>
        sparseCheckout: []
  variables:
    - name: dockerConnector
      type: String
      description: Docker Hub connector allowed to push harnesscommunity/drone-get-maven-version.
      value: <+input>
    - name: skipEffective
      type: String
      description: Set to true when the builder has no access to a Maven repository for the effective-mode contract check.
      value: <+input>.default(false).allowedValues(false,true)
    - name: windows2019BuilderPool
      type: String
      value: windows-2019
    - name: windows2022BuilderPool
      type: String
      value: windows-2022
    - name: windows2025BuilderPool
      type: String
      value: windows-2025
  stages:
    - stage:
        name: Release gate
        identifier: release_gate
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Refuse a malformed release
                  identifier: refuse_malformed_release
                  spec:
                    connectorRef: account.harnessImage
                    image: alpine:3.22
                    shell: Sh
                    command: sh scripts/check-release.sh
    - parallel:
        - stage:
            name: Publish Windows LTSC 2019
            identifier: publish_windows_amd64_ltsc2019
            type: CI
            spec:
              cloneCodebase: true
              platform:
                os: Windows
                arch: Amd64
              infrastructure:
                type: VM
                spec:
                  type: Pool
                  spec:
                    poolName: <+pipeline.variables.windows2019BuilderPool>
                    os: Windows
              execution:
                steps:
                  - step:
                      type: Run
                      name: Verify Windows LTSC 2019 host family
                      identifier: verify_ltsc2019_host
                      spec:
                        shell: Powershell
                        command: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows-release.ps1 -Ltsc ltsc2019 -Step host
                  - step:
                      type: Run
                      name: Refuse an existing release tag
                      identifier: refuse_existing_ltsc2019_tag
                      spec:
                        shell: Powershell
                        command: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows-release.ps1 -Ltsc ltsc2019 -Step tag-free
                  - step:
                      type: Run
                      name: Test and build drone-maven.exe
                      identifier: build_ltsc2019_binary
                      spec:
                        shell: Powershell
                        envVariables:
                          COMMIT_SHA: <+codebase.commitSha>
                          BUILD_ID: <+pipeline.sequenceId>
                        command: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows-release.ps1 -Ltsc ltsc2019 -Step binary
                  - step:
                      type: BuildAndPushDockerRegistry
                      name: Build and publish LTSC 2019 image
                      identifier: push_ltsc2019_image
                      spec:
                        connectorRef: <+pipeline.variables.dockerConnector>
                        repo: harnesscommunity/drone-get-maven-version
                        tags:
                          - windows-ltsc2019-r1
                        dockerfile: docker/Dockerfile.windows.amd64.ltsc2019
                        context: .
                        buildArgs:
                          REVISION: <+codebase.commitSha>
                  - step:
                      type: Run
                      name: Test published LTSC 2019 image
                      identifier: test_ltsc2019_image
                      spec:
                        connectorRef: <+pipeline.variables.dockerConnector>
                        image: harnesscommunity/drone-get-maven-version:windows-ltsc2019-r1
                        shell: Powershell
                        command: |-
                          $extra = @()
                          if ('<+pipeline.variables.skipEffective>' -eq 'true') { $extra += '-SkipEffective' }
                          powershell -NoProfile -ExecutionPolicy Bypass -File tests/contracts/Test-ImageContract.ps1 -ExpectedBuild 17763 @extra
                          exit $LASTEXITCODE
            delegateSelectors:
              - windows-vm
        - stage:
            name: Publish Windows LTSC 2022
            identifier: publish_windows_amd64_ltsc2022
            type: CI
            spec:
              cloneCodebase: true
              platform:
                os: Windows
                arch: Amd64
              infrastructure:
                type: VM
                spec:
                  type: Pool
                  spec:
                    poolName: <+pipeline.variables.windows2022BuilderPool>
                    os: Windows
              execution:
                steps:
                  - step:
                      type: Run
                      name: Verify Windows LTSC 2022 host family
                      identifier: verify_ltsc2022_host
                      spec:
                        shell: Powershell
                        command: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows-release.ps1 -Ltsc ltsc2022 -Step host
                  - step:
                      type: Run
                      name: Refuse an existing release tag
                      identifier: refuse_existing_ltsc2022_tag
                      spec:
                        shell: Powershell
                        command: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows-release.ps1 -Ltsc ltsc2022 -Step tag-free
                  - step:
                      type: Run
                      name: Test and build drone-maven.exe
                      identifier: build_ltsc2022_binary
                      spec:
                        shell: Powershell
                        envVariables:
                          COMMIT_SHA: <+codebase.commitSha>
                          BUILD_ID: <+pipeline.sequenceId>
                        command: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows-release.ps1 -Ltsc ltsc2022 -Step binary
                  - step:
                      type: BuildAndPushDockerRegistry
                      name: Build and publish LTSC 2022 image
                      identifier: push_ltsc2022_image
                      spec:
                        connectorRef: <+pipeline.variables.dockerConnector>
                        repo: harnesscommunity/drone-get-maven-version
                        tags:
                          - windows-ltsc2022-r1
                        dockerfile: docker/Dockerfile.windows.amd64.ltsc2022
                        context: .
                        buildArgs:
                          REVISION: <+codebase.commitSha>
                  - step:
                      type: Run
                      name: Test published LTSC 2022 image
                      identifier: test_ltsc2022_image
                      spec:
                        connectorRef: <+pipeline.variables.dockerConnector>
                        image: harnesscommunity/drone-get-maven-version:windows-ltsc2022-r1
                        shell: Powershell
                        command: |-
                          $extra = @()
                          if ('<+pipeline.variables.skipEffective>' -eq 'true') { $extra += '-SkipEffective' }
                          powershell -NoProfile -ExecutionPolicy Bypass -File tests/contracts/Test-ImageContract.ps1 -ExpectedBuild 20348 @extra
                          exit $LASTEXITCODE
            delegateSelectors:
              - windows-vm
        - stage:
            name: Publish Windows LTSC 2025
            identifier: publish_windows_amd64_ltsc2025
            type: CI
            spec:
              cloneCodebase: true
              platform:
                os: Windows
                arch: Amd64
              infrastructure:
                type: VM
                spec:
                  type: Pool
                  spec:
                    poolName: <+pipeline.variables.windows2025BuilderPool>
                    os: Windows
              execution:
                steps:
                  - step:
                      type: Run
                      name: Verify Windows LTSC 2025 host family
                      identifier: verify_ltsc2025_host
                      spec:
                        shell: Powershell
                        command: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows-release.ps1 -Ltsc ltsc2025 -Step host
                  - step:
                      type: Run
                      name: Refuse an existing release tag
                      identifier: refuse_existing_ltsc2025_tag
                      spec:
                        shell: Powershell
                        command: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows-release.ps1 -Ltsc ltsc2025 -Step tag-free
                  - step:
                      type: Run
                      name: Test and build drone-maven.exe
                      identifier: build_ltsc2025_binary
                      spec:
                        shell: Powershell
                        envVariables:
                          COMMIT_SHA: <+codebase.commitSha>
                          BUILD_ID: <+pipeline.sequenceId>
                        command: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows-release.ps1 -Ltsc ltsc2025 -Step binary
                  - step:
                      type: BuildAndPushDockerRegistry
                      name: Build and publish LTSC 2025 image
                      identifier: push_ltsc2025_image
                      spec:
                        connectorRef: <+pipeline.variables.dockerConnector>
                        repo: harnesscommunity/drone-get-maven-version
                        tags:
                          - windows-ltsc2025-r1
                        dockerfile: docker/Dockerfile.windows.amd64.ltsc2025
                        context: .
                        buildArgs:
                          REVISION: <+codebase.commitSha>
                  - step:
                      type: Run
                      name: Test published LTSC 2025 image
                      identifier: test_ltsc2025_image
                      spec:
                        connectorRef: <+pipeline.variables.dockerConnector>
                        image: harnesscommunity/drone-get-maven-version:windows-ltsc2025-r1
                        shell: Powershell
                        command: |-
                          $extra = @()
                          if ('<+pipeline.variables.skipEffective>' -eq 'true') { $extra += '-SkipEffective' }
                          powershell -NoProfile -ExecutionPolicy Bypass -File tests/contracts/Test-ImageContract.ps1 -ExpectedBuild 26100 @extra
                          exit $LASTEXITCODE
            delegateSelectors:
              - windows-vm
